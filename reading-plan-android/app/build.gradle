plugins {
    id "com.android.application"
}

tasks.register("checkQuarterPlanning", JavaExec) {
    dependsOn "compileDebugUnitTestJavaWithJavac"
    mainClass = "com.petermolnar.readingplan.PlannedQuarterCheck"
    enableAssertions = true
    classpath = files(
            tasks.named("compileDebugJavaWithJavac").map { it.destinationDirectory },
            tasks.named("compileDebugUnitTestJavaWithJavac").map { it.destinationDirectory },
            androidComponents.sdkComponents.bootClasspath)
}

android {
    namespace "com.petermolnar.readingplan"
    compileSdk 35

    defaultConfig {
        applicationId "com.petermolnar.readingplan"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
