name: Apply Android UI update from temporary PR

on:
  pull_request:
    types: [reopened]
    branches:
      - charts-audio

permissions:
  contents: write

jobs:
  update-android-ui:
    if: github.event.pull_request.head.ref == 'agent/run-android-ui-update'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: charts-audio
          fetch-depth: 0
          show-progress: false

      - name: Update MainActivity
        run: python3 .github/scripts/update_android_ui.py

      - name: Build Android app
        working-directory: reading-plan-android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit and push update
        shell: bash
        run: |
          rm -f .github/android-ui-update-error.log .github/android-ui-update-extracted.sh
          rm -rf .github/scripts
          rm .github/workflows/apply-android-ui-update.yml
          rm .github/workflows/trigger-android-ui-update.yml
          rm .github/workflows/pr-apply-android-ui-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading-plan-android/app/src/main/java/com/petermolnar/readingplan/MainActivity.java .github/
          git diff --cached --check
          git commit -m "update charts and session UI"
          git push origin HEAD:charts-audio
