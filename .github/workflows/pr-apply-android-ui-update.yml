name: Apply Android UI update from temporary PR

on:
  pull_request:
    types: [opened]
    branches:
      - charts-audio

permissions:
  contents: write

jobs:
  update-android-ui:
    if: github.event.pull_request.head.ref == 'agent/run-android-ui-update'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: charts-audio
          fetch-depth: 0

      - name: Run stored source update
        shell: bash
        run: |
          awk '
            /      - name: Update MainActivity/ { found=1; next }
            found && /      - name: Build Android app/ { exit }
            found && /^        run: \|/ { capture=1; next }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-android-ui-update.yml > /tmp/apply-update.sh
          bash /tmp/apply-update.sh

      - name: Build Android app
        working-directory: reading-plan-android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit and push update
        shell: bash
        run: |
          rm .github/workflows/apply-android-ui-update.yml
          rm .github/workflows/trigger-android-ui-update.yml
          rm .github/workflows/pr-apply-android-ui-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading-plan-android/app/src/main/java/com/petermolnar/readingplan/MainActivity.java .github/workflows/
          git diff --cached --check
          git commit -m "update charts and session UI"
          git push origin HEAD:charts-audio
